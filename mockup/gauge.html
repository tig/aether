<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aether — AFR Gauge Mockup (square face)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #ccc;
      font-family: "Segoe UI", system-ui, sans-serif;
      gap: 0.75rem;
      padding: 1rem;
    }
    h1 { font-size: 0.9rem; font-weight: 500; letter-spacing: 0.08em; color: #777; margin: 0; }
    .sub {
      font-size: 0.72rem;
      color: #555;
      text-align: center;
      max-width: 22rem;
      margin: 0;
      line-height: 1.35;
    }
    .device {
      width: min(92vw, 420px);
      aspect-ratio: 1 / 1;
      background: #000;
      border: 1px solid #333;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      overflow: hidden;
      position: relative;
    }
    .device canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
      cursor: pointer;
    }
    .meta {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.78rem;
      color: #666;
    }
    .badge {
      padding: 0.2rem 0.6rem;
      border: 1px solid #333;
      border-radius: 999px;
      font-size: 0.68rem;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>AETHER · SQUARE AFR FACE</h1>
  <p class="sub">
    Square panel; circular inner ring; segment length grows toward the corners
    so the arc fills flush left / top / right. Fat <strong>MODE</strong> / <strong>SEL</strong>.
  </p>
  <div class="device" id="device">
    <canvas id="gauge" width="368" height="368" aria-label="Air fuel ratio gauge, square face"></canvas>
  </div>
  <div class="meta" id="meta">—</div>
  <div class="badge">tap MODE / SEL · python -m mockup for stream dump</div>

  <script>
    // Visual twin of mockup/afr_gauge.py (Python is canonical / unit-tested).
    // Square face: circular arc diameter = width (flush L/T/R); MODE/SEL flush bottom.
    const AFR_MIN = 8.0;
    const AFR_MAX = 20.0;
    const AFR_STOICH = 14.7;
    const SEGMENT_COUNT = 36;
    const BAND_RICH_RED_LT = 11.5;
    const BAND_GREEN_LT = 15.0;
    const BAND_AMBER_LT = 15.8;

    // Bottom bar height; buttons flush to L/R/B with a thin gap between.
    const BTN_STRIP_FRAC = 0.18;
    const BTN_GAP = 6;

    function clampAfr(afr) {
      return Math.min(AFR_MAX, Math.max(AFR_MIN, afr));
    }
    function isInRange(afr) {
      return afr >= AFR_MIN && afr <= AFR_MAX;
    }
    function bandForAfr(afr) {
      if (!isInRange(afr)) return "invalid";
      if (afr < BAND_RICH_RED_LT) return "red";
      if (afr < BAND_GREEN_LT) return "green";
      if (afr < BAND_AMBER_LT) return "amber";
      return "red";
    }
    function segmentMidpointAfr(i, n = SEGMENT_COUNT) {
      const span = AFR_MAX - AFR_MIN;
      return AFR_MIN + (i + 0.5) * span / n;
    }
    function segmentBand(i) {
      const b = bandForAfr(segmentMidpointAfr(i));
      return b === "invalid" ? "red" : b;
    }
    function litCountForAfr(afr, n = SEGMENT_COUNT) {
      const display = clampAfr(afr);
      const span = AFR_MAX - AFR_MIN;
      let count = Math.floor(((display - AFR_MIN) / span) * n + 1e-9) + 1;
      return Math.min(n, Math.max(1, count));
    }
    function mapAfr(afr) {
      const valid = isInRange(afr);
      const display = clampAfr(afr);
      const band = valid ? bandForAfr(afr) : "invalid";
      const litCount = litCountForAfr(display);
      const litIndices = [...Array(litCount).keys()];
      const segmentBands = [...Array(SEGMENT_COUNT).keys()].map(segmentBand);
      return { afr, display, valid, band, litCount, litIndices, segmentBands };
    }

    let holdTarget = null;
    let holdRemaining = 0;
    function nextSimAfr() {
      if (holdRemaining > 0) {
        holdRemaining--;
        return holdTarget + (Math.random() - 0.5) * 0.3;
      }
      if (Math.random() < 0.06) {
        holdTarget = Math.random() < 0.5 ? 11.0 : 17.5;
        holdRemaining = 4 + Math.floor(Math.random() * 6);
        return holdTarget;
      }
      return AFR_STOICH + (Math.random() - 0.5) * 0.7;
    }

    const COLORS = {
      green: "#22c55e",
      amber: "#f59e0b",
      red: "#ef4444",
      invalid: "#444",
      dim: "#1a1a1e",
    };

    const MODES = ["LIVE", "PEAK", "AVG"];
    let modeIdx = 0;
    let selHold = false;
    let flashBtn = null;
    let flashUntil = 0;
    let lastState = mapAfr(AFR_STOICH);

    function layout(w, h) {
      const stripH = Math.round(h * BTN_STRIP_FRAC);
      const btnY = h - stripH;
      const btnH = stripH;
      const btnW = (w - BTN_GAP) / 2;
      // Center of face; min side half-width for circular inner ring.
      const half = w / 2;
      const cx = w / 2;
      const cy = half; // mid-face so mid-side rays hit L/T/R edges
      return {
        w, h, stripH, btnY, half,
        cx, cy,
        // Circular inner radius (constant); outer grows toward corners / edges.
        innerR: half * 0.70,
        mode: { x: 0, y: btnY, w: btnW, h: btnH, id: "mode" },
        sel:  { x: btnW + BTN_GAP, y: btnY, w: btnW, h: btnH, id: "sel" },
      };
    }

    /**
     * Distance from center to the square face boundary along angle a
     * (our convention: x = cx + r*cos(a), y = cy - r*sin(a)).
     * Mid-side rays are shorter (to the edge); corner rays are longer
     * (e.g. top-left ~AFR 12 reaches the corner). Bottom clamped above MODE/SEL.
     */
    function outerRadiusAt(a, L) {
      const dx = Math.cos(a);
      const dy = -Math.sin(a); // screen-space ray direction
      let rMax = Infinity;
      if (dx > 1e-9) rMax = Math.min(rMax, (L.w - L.cx) / dx);
      if (dx < -1e-9) rMax = Math.min(rMax, (0 - L.cx) / dx);
      if (dy > 1e-9) rMax = Math.min(rMax, (L.btnY - L.cy) / dy);
      if (dy < -1e-9) rMax = Math.min(rMax, (0 - L.cy) / dy);
      // Stay slightly inside the pixel edge
      return Math.max(L.innerR + 4, rMax - 0.5);
    }

    function drawButton(ctx, rect, label, active) {
      const now = performance.now();
      const flashing = flashBtn === rect.id && now < flashUntil;
      const fill = flashing ? "#2a3a55" : (active ? "#1e2a3a" : "#141418");
      const stroke = flashing ? "#6af" : (active ? "#4a7ab0" : "#2e2e36");
      ctx.fillStyle = fill;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.strokeRect(rect.x + 1, rect.y + 1, rect.w - 2, rect.h - 2);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#eee";
      const titlePx = Math.max(18, Math.round(rect.h * 0.42));
      ctx.font = `700 ${titlePx}px Segoe UI, system-ui, sans-serif`;
      ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2);
    }

    function drawGauge(ctx, state) {
      const w = ctx.canvas.width;
      const h = ctx.canvas.height;
      const L = layout(w, h);

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#050508";
      ctx.fillRect(0, 0, w, h);

      const { cx, cy, innerR } = L;
      // Nearly full circle; leave a bottom gap so digits / buttons stay clear
      const startDeg = 225;
      const sweepDeg = 270;
      const n = SEGMENT_COUNT;
      const litSet = new Set(state.litIndices);

      function pt(r, a) {
        return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
      }

      // Variable-length radial segments: circular inner ring, outer edge follows
      // the square (long toward corners / top-left ~12, shorter at mid-sides).
      for (let i = 0; i < n; i++) {
        const a0 = (startDeg - (i / n) * sweepDeg) * Math.PI / 180;
        const a1 = (startDeg - ((i + 1) / n) * sweepDeg) * Math.PI / 180;
        const gap = 0.012;
        const aa0 = a0 - gap;
        const aa1 = a1 + gap;
        const steps = 8;
        ctx.beginPath();
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const a = aa0 + (aa1 - aa0) * t;
          const [x, y] = pt(outerRadiusAt(a, L), a);
          if (s === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        for (let s = steps; s >= 0; s--) {
          const t = s / steps;
          const a = aa0 + (aa1 - aa0) * t;
          const [x, y] = pt(innerR, a);
          ctx.lineTo(x, y);
        }
        ctx.closePath();
        const band = state.segmentBands[i];
        ctx.fillStyle = litSet.has(i) ? (COLORS[band] || COLORS.dim) : COLORS.dim;
        ctx.fill();
      }

      // Scale marks inside the ring
      ctx.fillStyle = "#888";
      ctx.font = `${Math.max(12, Math.round(w * 0.038))}px Segoe UI, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const mark of [8, 11, 13, 15, 17, 20]) {
        const t = (mark - AFR_MIN) / (AFR_MAX - AFR_MIN);
        const a = (startDeg - t * sweepDeg) * Math.PI / 180;
        const r = innerR - Math.round(w * 0.055);
        const [x, y] = pt(r, a);
        ctx.fillText(String(mark), x, y);
      }

      // Center readout
      const readout = state.valid ? state.display.toFixed(1) : "--.-";
      const digitPx = Math.round(w * 0.20);
      ctx.fillStyle = "#ff2a2a";
      ctx.font = `bold ${digitPx}px Consolas, ui-monospace, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(255,40,40,0.4)";
      ctx.shadowBlur = 10;
      ctx.fillText(readout, cx, cy * 0.95);
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#b8b8c0";
      ctx.font = `600 ${Math.max(12, Math.round(w * 0.042))}px Segoe UI, sans-serif`;
      ctx.fillText("AIR/FUEL RATIO", cx, cy * 0.95 + digitPx * 0.55);

      // MODE / SEL — flush left, right, bottom; only the title on each button
      ctx.fillStyle = "#0a0a0c";
      ctx.fillRect(0, L.mode.y, w, L.stripH);
      drawButton(ctx, L.mode, "MODE", false);
      drawButton(ctx, L.sel, "SEL", selHold);
    }

    const canvas = document.getElementById("gauge");
    const ctx = canvas.getContext("2d");
    const meta = document.getElementById("meta");

    function hitTest(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      const y = (clientY - rect.top) * (canvas.height / rect.height);
      const L = layout(canvas.width, canvas.height);
      for (const b of [L.mode, L.sel]) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
      }
      return null;
    }

    function onPress(id) {
      flashBtn = id;
      flashUntil = performance.now() + 180;
      if (id === "mode") {
        modeIdx = (modeIdx + 1) % MODES.length;
      } else if (id === "sel") {
        selHold = !selHold;
      }
      drawGauge(ctx, lastState);
      meta.textContent =
        `AFR ${lastState.display.toFixed(2)}  band=${lastState.band}  mode=${MODES[modeIdx]}` +
        (selHold ? "  SEL=hold" : "");
    }

    canvas.addEventListener("pointerdown", (e) => {
      const id = hitTest(e.clientX, e.clientY);
      if (id) {
        e.preventDefault();
        onPress(id);
      }
    });

    function tick() {
      if (!selHold) {
        const afr = nextSimAfr();
        lastState = mapAfr(afr);
      }
      drawGauge(ctx, lastState);
      meta.textContent =
        `AFR ${lastState.display.toFixed(2)}  band=${lastState.band}  lit=${lastState.litCount}/${SEGMENT_COUNT}` +
        `  mode=${MODES[modeIdx]}` +
        (lastState.valid ? "" : "  INVALID") +
        (selHold ? "  [frozen]" : "");
      requestAnimationFrame(() => setTimeout(tick, 180));
    }
    tick();
  </script>
</body>
</html>
