<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aether — AFR Gauge Mockup (square face)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #ccc;
      font-family: "Segoe UI", system-ui, sans-serif;
      gap: 0.75rem;
      padding: 1rem;
    }
    h1 { font-size: 0.9rem; font-weight: 500; letter-spacing: 0.08em; color: #777; margin: 0; }
    .sub {
      font-size: 0.72rem;
      color: #555;
      text-align: center;
      max-width: 22rem;
      margin: 0;
      line-height: 1.35;
    }
    .device {
      width: min(92vw, 420px);
      aspect-ratio: 1 / 1;
      background: #000;
      border: 1px solid #333;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      overflow: hidden;
      position: relative;
    }
    .device canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
      cursor: pointer;
    }
    .meta {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.78rem;
      color: #666;
    }
    .badge {
      padding: 0.2rem 0.6rem;
      border: 1px solid #333;
      border-radius: 999px;
      font-size: 0.68rem;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>AETHER · SQUARE AFR FACE</h1>
  <p class="sub">
    Square panel; rounded-square inner; outer fills to the edges; stoich (~14.7)
    always tick-lit. Fat <strong>MODE</strong> / <strong>SEL</strong>.
  </p>
  <div class="device" id="device">
    <canvas id="gauge" width="368" height="368" aria-label="Air fuel ratio gauge, square face"></canvas>
  </div>
  <div class="meta" id="meta">—</div>
  <div class="badge">tap MODE / SEL · python -m mockup for stream dump</div>

  <script>
    // Visual twin of mockup/afr_gauge.py (Python is canonical / unit-tested).
    // Square face: circular arc diameter = width (flush L/T/R); MODE/SEL flush bottom.
    const AFR_MIN = 8.0;
    const AFR_MAX = 20.0;
    const AFR_STOICH = 14.7;
    const SEGMENT_COUNT = 36;
    const BAND_RICH_RED_LT = 11.5;
    const BAND_GREEN_LT = 15.0;
    const BAND_AMBER_LT = 15.8;

    // Bottom bar height; buttons flush to L/R/B with a thin gap between.
    const BTN_STRIP_FRAC = 0.18;
    const BTN_GAP = 6;

    function clampAfr(afr) {
      return Math.min(AFR_MAX, Math.max(AFR_MIN, afr));
    }
    function isInRange(afr) {
      return afr >= AFR_MIN && afr <= AFR_MAX;
    }
    function bandForAfr(afr) {
      if (!isInRange(afr)) return "invalid";
      if (afr < BAND_RICH_RED_LT) return "red";
      if (afr < BAND_GREEN_LT) return "green";
      if (afr < BAND_AMBER_LT) return "amber";
      return "red";
    }
    function segmentMidpointAfr(i, n = SEGMENT_COUNT) {
      const span = AFR_MAX - AFR_MIN;
      return AFR_MIN + (i + 0.5) * span / n;
    }
    function segmentBand(i) {
      const b = bandForAfr(segmentMidpointAfr(i));
      return b === "invalid" ? "red" : b;
    }
    function litCountForAfr(afr, n = SEGMENT_COUNT) {
      const display = clampAfr(afr);
      const span = AFR_MAX - AFR_MIN;
      let count = Math.floor(((display - AFR_MIN) / span) * n + 1e-9) + 1;
      return Math.min(n, Math.max(1, count));
    }
    function mapAfr(afr) {
      const valid = isInRange(afr);
      const display = clampAfr(afr);
      const band = valid ? bandForAfr(afr) : "invalid";
      const litCount = litCountForAfr(display);
      const litIndices = [...Array(litCount).keys()];
      const segmentBands = [...Array(SEGMENT_COUNT).keys()].map(segmentBand);
      return { afr, display, valid, band, litCount, litIndices, segmentBands };
    }

    let holdTarget = null;
    let holdRemaining = 0;
    function nextSimAfr() {
      if (holdRemaining > 0) {
        holdRemaining--;
        return holdTarget + (Math.random() - 0.5) * 0.3;
      }
      if (Math.random() < 0.06) {
        holdTarget = Math.random() < 0.5 ? 11.0 : 17.5;
        holdRemaining = 4 + Math.floor(Math.random() * 6);
        return holdTarget;
      }
      return AFR_STOICH + (Math.random() - 0.5) * 0.7;
    }

    const COLORS = {
      green: "#22c55e",
      amber: "#f59e0b",
      red: "#ef4444",
      invalid: "#444",
      dim: "#1a1a1e",
      // Soft stoich tick (~14.7) when that segment is not fill-lit
      stoichHint: "#2a4a32",
      stoichHintEdge: "#3d6b48",
    };

    /** Segment index that contains AFR 14.7 (stoich mark on the arc). */
    function stoichSegmentIndex(n = SEGMENT_COUNT) {
      const span = AFR_MAX - AFR_MIN;
      let i = Math.floor(((AFR_STOICH - AFR_MIN) / span) * n);
      return Math.min(n - 1, Math.max(0, i));
    }
    const STOICH_SEG = stoichSegmentIndex();

    const MODES = ["LIVE", "PEAK", "AVG"];
    let modeIdx = 0;
    let selHold = false;
    let flashBtn = null;
    let flashUntil = 0;
    let lastState = mapAfr(AFR_STOICH);

    // Ring envelope: sides/top 30% smaller than full face half → more open center.
    const OUTER_SCALE = 0.70;
    // Larger rounded-square hole so AFR digits can grow.
    const INNER_SCALE = 0.62;

    function layout(w, h) {
      const stripH = Math.round(h * BTN_STRIP_FRAC);
      const btnY = h - stripH;
      const btnH = stripH;
      const btnW = (w - BTN_GAP) / 2;
      const half = w / 2;
      const cx = w / 2;
      const cy = half;
      const outerHalf = half * OUTER_SCALE;
      const innerHalf = half * INNER_SCALE;
      const innerCorner = innerHalf * 0.28;
      return {
        w, h, stripH, btnY, half,
        cx, cy,
        outerHalf,
        innerHalf,
        innerCorner,
        mode: { x: 0, y: btnY, w: btnW, h: btnH, id: "mode" },
        sel:  { x: btnW + BTN_GAP, y: btnY, w: btnW, h: btnH, id: "sel" },
      };
    }

    /**
     * Ray length from origin to a rounded square (axis-aligned, center origin)
     * of half-side `half` and corner radius `corner`. Direction (ux, uy) unit.
     */
    function radiusToRoundedSquare(ux, uy, half, corner) {
      const ax = Math.abs(ux);
      const ay = Math.abs(uy);
      const flat = half - corner;
      if (flat <= 0) {
        // Degenerate: treat as circle of radius half
        return half;
      }
      // Hit vertical flat?
      if (ax > 1e-12) {
        const t = half / ax;
        if (Math.abs(t * uy) <= flat + 1e-9) return t;
      }
      // Hit horizontal flat?
      if (ay > 1e-12) {
        const t = half / ay;
        if (Math.abs(t * ux) <= flat + 1e-9) return t;
      }
      // Corner quarter-circle (center at (±flat, ±flat) in the ray's quadrant).
      // Solid is the interior of the disk in the corner — exterior boundary is
      // the far arc (larger root), not the near intersection.
      const ccx = Math.sign(ux || 1) * flat;
      const ccy = Math.sign(uy || 1) * flat;
      const b = ux * ccx + uy * ccy; // d·C
      const c0 = ccx * ccx + ccy * ccy - corner * corner;
      const disc = b * b - c0;
      if (disc < 0) return half;
      const t2 = b + Math.sqrt(disc);
      if (t2 > 1e-9) return t2;
      return half;
    }

    /** Outer: sharp square, 30% inset from full face (sides/top smaller). */
    function outerRadiusAt(a, L) {
      const dx = Math.cos(a);
      const dy = -Math.sin(a);
      const oh = L.outerHalf;
      // Virtual square [cx±oh] × [cy±oh], also stay above buttons.
      let rMax = Infinity;
      if (dx > 1e-9) rMax = Math.min(rMax, oh / dx);
      if (dx < -1e-9) rMax = Math.min(rMax, oh / -dx);
      if (dy > 1e-9) rMax = Math.min(rMax, Math.min(oh, L.btnY - L.cy) / dy);
      if (dy < -1e-9) rMax = Math.min(rMax, oh / -dy);
      return Math.max(L.innerHalf + 4, rMax - 0.5);
    }

    /** Inner: rounded square aperture. */
    function innerRadiusAt(a, L) {
      const ux = Math.cos(a);
      const uy = -Math.sin(a);
      return radiusToRoundedSquare(ux, uy, L.innerHalf, L.innerCorner);
    }

    function segmentFill(i, band, lit) {
      if (lit) return COLORS[band] || COLORS.dim;
      if (i === STOICH_SEG) return COLORS.stoichHint;
      return COLORS.dim;
    }

    function drawButton(ctx, rect, label, active) {
      const now = performance.now();
      const flashing = flashBtn === rect.id && now < flashUntil;
      const fill = flashing ? "#2a3a55" : (active ? "#1e2a3a" : "#141418");
      const stroke = flashing ? "#6af" : (active ? "#4a7ab0" : "#2e2e36");
      ctx.fillStyle = fill;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.strokeRect(rect.x + 1, rect.y + 1, rect.w - 2, rect.h - 2);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#eee";
      const titlePx = Math.max(18, Math.round(rect.h * 0.42));
      ctx.font = `700 ${titlePx}px Segoe UI, system-ui, sans-serif`;
      ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2);
    }

    function drawGauge(ctx, state) {
      const w = ctx.canvas.width;
      const h = ctx.canvas.height;
      const L = layout(w, h);

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#050508";
      ctx.fillRect(0, 0, w, h);

      const { cx, cy } = L;
      // Nearly full arc; leave a bottom gap so digits / buttons stay clear
      const startDeg = 225;
      const sweepDeg = 270;
      const n = SEGMENT_COUNT;
      const litSet = new Set(state.litIndices);

      function pt(r, a) {
        return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
      }

      // Variable-length segments: rounded-square inner, square outer (to L/T/R edges).
      for (let i = 0; i < n; i++) {
        const a0 = (startDeg - (i / n) * sweepDeg) * Math.PI / 180;
        const a1 = (startDeg - ((i + 1) / n) * sweepDeg) * Math.PI / 180;
        const gap = 0.012;
        const aa0 = a0 - gap;
        const aa1 = a1 + gap;
        const steps = 10;
        ctx.beginPath();
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const a = aa0 + (aa1 - aa0) * t;
          const [x, y] = pt(outerRadiusAt(a, L), a);
          if (s === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        for (let s = steps; s >= 0; s--) {
          const t = s / steps;
          const a = aa0 + (aa1 - aa0) * t;
          const [x, y] = pt(innerRadiusAt(a, L), a);
          ctx.lineTo(x, y);
        }
        ctx.closePath();
        const band = state.segmentBands[i];
        const lit = litSet.has(i);
        ctx.fillStyle = segmentFill(i, band, lit);
        ctx.fill();
        // Stoich segment: subtle edge glow when not fully lit
        if (i === STOICH_SEG && !lit) {
          ctx.strokeStyle = COLORS.stoichHintEdge;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }

      // Scale marks — just inside the rounded-square aperture
      const labelPx = Math.max(16, Math.round(w * 0.052));
      ctx.fillStyle = "#c8c8d0";
      ctx.font = `600 ${labelPx}px Segoe UI, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const mark of [8, 11, 13, 15, 17, 20]) {
        const t = (mark - AFR_MIN) / (AFR_MAX - AFR_MIN);
        const a = (startDeg - t * sweepDeg) * Math.PI / 180;
        const r = Math.max(8, innerRadiusAt(a, L) - labelPx * 0.75);
        const [x, y] = pt(r, a);
        ctx.fillText(String(mark), x, y);
      }

      // Large center AFR readout (room opened by 30% smaller ring)
      const readout = state.valid ? state.display.toFixed(1) : "--.-";
      const digitPx = Math.round(w * 0.28);
      ctx.fillStyle = "#ff2a2a";
      ctx.font = `bold ${digitPx}px Consolas, ui-monospace, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(255,40,40,0.4)";
      ctx.shadowBlur = 12;
      // Sit in upper-mid of the open aperture
      const digitY = cy - L.innerHalf * 0.06;
      ctx.fillText(readout, cx, digitY);
      ctx.shadowBlur = 0;

      // MODE / SEL first so label can sit just above them
      ctx.fillStyle = "#0a0a0c";
      ctx.fillRect(0, L.mode.y, w, L.stripH);
      drawButton(ctx, L.mode, "MODE", false);
      drawButton(ctx, L.sel, "SEL", selHold);

      // AIR/FUEL RATIO — bottom-justified above the button bar
      const captionPx = Math.max(13, Math.round(w * 0.045));
      ctx.fillStyle = "#b8b8c0";
      ctx.font = `600 ${captionPx}px Segoe UI, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText("AIR/FUEL RATIO", cx, L.btnY - 6);
    }

    const canvas = document.getElementById("gauge");
    const ctx = canvas.getContext("2d");
    const meta = document.getElementById("meta");

    function hitTest(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      const y = (clientY - rect.top) * (canvas.height / rect.height);
      const L = layout(canvas.width, canvas.height);
      for (const b of [L.mode, L.sel]) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
      }
      return null;
    }

    function onPress(id) {
      flashBtn = id;
      flashUntil = performance.now() + 180;
      if (id === "mode") {
        modeIdx = (modeIdx + 1) % MODES.length;
      } else if (id === "sel") {
        selHold = !selHold;
      }
      drawGauge(ctx, lastState);
      meta.textContent =
        `AFR ${lastState.display.toFixed(2)}  band=${lastState.band}  mode=${MODES[modeIdx]}` +
        (selHold ? "  SEL=hold" : "");
    }

    canvas.addEventListener("pointerdown", (e) => {
      const id = hitTest(e.clientX, e.clientY);
      if (id) {
        e.preventDefault();
        onPress(id);
      }
    });

    function tick() {
      if (!selHold) {
        const afr = nextSimAfr();
        lastState = mapAfr(afr);
      }
      drawGauge(ctx, lastState);
      meta.textContent =
        `AFR ${lastState.display.toFixed(2)}  band=${lastState.band}  lit=${lastState.litCount}/${SEGMENT_COUNT}` +
        `  mode=${MODES[modeIdx]}` +
        (lastState.valid ? "" : "  INVALID") +
        (selHold ? "  [frozen]" : "");
      requestAnimationFrame(() => setTimeout(tick, 180));
    }
    tick();
  </script>
</body>
</html>
