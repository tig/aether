name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

# C plate host path on CI:
#   1) cmake host_test (pure C; no silico required for that step)
#   2) silico gate include-hygiene (+ [host].gate) via sibling tig/silico checkout
#   3) software bench (V-ECU + V-AETHER + orch + ESPREC)
#   4) QEMU identity knock (real firmware image under Espressif QEMU)
jobs:
  host-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcu
    steps:
      - name: Checkout GCU
        uses: actions/checkout@v4
        with:
          path: gcu
      - name: Checkout silico (sibling host spine)
        uses: actions/checkout@v4
        with:
          repository: tig/silico
          path: silico
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install silico (editable) + bedside + pytest
        run: |
          python -m pip install -U pip
          python -m pip install -e ../silico
          python -m pip install -e ../silico/third_party/bedside
          python -m pip install pytest
      - name: Configure host tests
        run: cmake -S host -B build/host
      - name: CMake host_test
        run: cmake --build build/host --target host_test
      - name: Build ecu_tcp_bench (C client vs V-ECU)
        run: cmake --build build/host --target ecu_tcp_bench
      - name: silico gate (include hygiene + host.gate)
        run: silico gate
      - name: AFR mockup unit tests
        run: python -m pytest mockup/tests -q
      - name: Software bench (V-ECU + V-AETHER + orch + ESPREC + C client)
        run: python -m pytest sim/tests -q
      - name: Software bench orchestrator smoke
        run: python -m sim.orch all --out sim/out
      - name: Upload sim-bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-bench-out
          path: gcu/sim/out/
          if-no-files-found: ignore

  qemu-identity:
    runs-on: ubuntu-latest
    needs: host-gate
    defaults:
      run:
        working-directory: gcu
    steps:
      - name: Checkout GCU
        uses: actions/checkout@v4
        with:
          path: gcu
      - name: Build firmware + merge flash + identity knock under QEMU
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: gcu/firmware
          command: >
            bash -lc '
            set -euo pipefail
            idf.py build
            esptool.py --chip esp32s3 merge_bin --fill-flash-size 4MB
              -o build/qemu_flash.bin @build/flash_args
            ls -la build/qemu_flash.bin
            # Prebuilt Espressif QEMU (xtensa) for ESP32-S3
            python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
            . "$IDF_PATH/export.sh"
            python ../sim/qemu/identity_knock.py
              --flash build/qemu_flash.bin
              --machine esp32s3
              --port 5555
              --boot-timeout 40
              --knock-timeout 15
            '
      - name: Upload QEMU flash (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-identity-flash
          path: gcu/firmware/build/qemu_flash.bin
          if-no-files-found: ignore
