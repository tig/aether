name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

# C plate host path on CI:
#   1) cmake host_test (pure C; no silico required for that step)
#   2) silico gate include-hygiene (+ [host].gate) via sibling tig/silico checkout
#   3) software bench (V-ECU + V-AETHER + orch + ESPREC)
#   4) QEMU identity (real firmware image under Espressif QEMU)
jobs:
  host-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcu
    steps:
      - name: Checkout GCU
        uses: actions/checkout@v4
        with:
          path: gcu
      - name: Checkout silico (sibling host spine)
        uses: actions/checkout@v4
        with:
          repository: tig/silico
          path: silico
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install silico (editable) + bedside + pytest
        run: |
          python -m pip install -U pip
          python -m pip install -e ../silico
          python -m pip install -e ../silico/third_party/bedside
          python -m pip install pytest
      - name: Configure host tests
        run: cmake -S host -B build/host
      - name: CMake host_test
        run: cmake --build build/host --target host_test
      - name: Build ecu_tcp_bench (C client vs V-ECU)
        run: cmake --build build/host --target ecu_tcp_bench
      - name: silico gate (include hygiene + host.gate)
        run: silico gate
      - name: AFR mockup unit tests
        run: python -m pytest mockup/tests -q
      - name: Software bench (V-ECU + V-AETHER + orch + ESPREC + C client)
        run: python -m pytest sim/tests -q
      - name: Software bench orchestrator smoke
        run: python -m sim.orch all --out sim/out
      - name: Upload sim-bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-bench-out
          path: gcu/sim/out/
          if-no-files-found: ignore

  qemu-identity:
    runs-on: ubuntu-latest
    needs: host-gate
    defaults:
      run:
        working-directory: gcu
    steps:
      - name: Checkout GCU
        uses: actions/checkout@v4
        with:
          path: gcu
      - name: Build firmware (ESP-IDF esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: gcu/firmware
          command: idf.py build
      - name: Merge flash image for QEMU
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: gcu/firmware
          command: >
            bash -lc 'esptool.py --chip esp32s3 merge_bin --fill-flash-size 4MB
            -o build/qemu_flash.bin @build/flash_args && ls -la build/qemu_flash.bin'
      - name: Run firmware in QEMU
        uses: tobozo/esp32-qemu-sim@v1
        with:
          chip: esp32s3
          flash-image: gcu/firmware/build/qemu_flash.bin
          flash-size: "4"
          qemu-timeout: "60"
          timeout-interrupt-regex: "fw_name=AETHER"
      - name: Assert identity in QEMU log
        working-directory: .
        run: |
          set -e
          LOG=""
          for c in logs.txt ./logs.txt gcu/logs.txt; do
            if [ -f "$c" ]; then LOG="$c"; break; fi
          done
          if [ -z "$LOG" ]; then
            LOG=$(find . -name 'logs.txt' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then
            echo "FAIL: logs.txt not found after QEMU run"
            find . -maxdepth 4 -type f -name '*.txt' 2>/dev/null | head -40
            exit 1
          fi
          echo "Using log: $LOG"
          python3 gcu/sim/qemu/run_identity_check.py "$LOG"
      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-identity-logs
          path: |
            logs.txt
            **/logs.txt
            gcu/firmware/build/qemu_flash.bin
          if-no-files-found: ignore
